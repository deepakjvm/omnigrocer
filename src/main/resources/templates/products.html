<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport"
	content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<link rel="stylesheet"
	href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
	integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
	crossorigin="anonymous">
<title>OmniGrocer - Product Management</title>
</head>
<body class="bg-light">
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container-fluid">
			<a class="navbar-brand" th:href="@{/admin/}">
				<span class="font-weight-bold text-light">OmniGrocer Admin</span>
			</a>
			<button class="navbar-toggler" type="button" data-toggle="collapse"
				data-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav mr-auto"></ul>
				<ul class="navbar-nav">
					<li class="nav-item active"><a class="nav-link" th:href="@{/admin/}">Home Page</a></li>
					<li class="nav-item active"><a class="nav-link" th:href="@{/admin/logout}">Logout</a></li>
				</ul>
			</div>
		</div>
	</nav><br>
	<div class="container-fluid">
		<a style="margin: 20px 0" class="btn btn-primary" th:href="@{/admin/products/add}">Add Product</a><br>
		<table class="table">
			<thead class="thead-light">
				<tr>
					<th scope="col">Serial No.</th>
					<th scope="col">Product Name</th>
					<th scope="col">Category</th>
					<th scope="col">Preview</th>
					<th scope="col">Quantity</th>
					<th scope="col">Price</th>
					<th scope="col">Weight</th>
					<th scope="col">Description</th>
					<th scope="col">Delete</th>
					<th scope="col">Update</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="product : ${products}">
					<td th:text="${product.id}">1</td>
					<td th:text="${product.name}">Name</td>
					<td th:text="${product.category != null ? product.category.name : 'N/A'}">Category</td>
					<td><img th:src="${product.image}" height="100px" width="100px" alt="Product Image"></td>
					<td th:text="${product.quantity}">0</td>
					<td th:text="${product.price}">0</td>
					<td th:text="${product.weight}">0</td>
					<td th:text="${product.description}">Desc</td>
					<td>
						<form th:action="@{/admin/products/delete}" method="post">
							<input type="hidden" name="id" th:value="${product.id}">
							<input type="submit" value="Delete" class="btn btn-danger">
						</form>
					</td>
					<td>
						<form th:action="@{'/admin/products/update/' + ${product.id}}" method="get">
							<input type="submit" value="Update" class="btn btn-warning">
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
		integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
		integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
		crossorigin="anonymous"></script>
	<script
		src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
		integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
		crossorigin="anonymous"></script>
</body>
</html>
