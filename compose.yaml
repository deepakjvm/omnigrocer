services:
  postgres:
    image: postgres:17-alpine
    container_name: omnigrocer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnigrocer
      POSTGRES_USER: omnigrocer
      POSTGRES_PASSWORD: omnigrocer_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./basedata.sql:/docker-entrypoint-initdb.d/01-basedata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnigrocer -d omnigrocer"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnigrocer-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omnigrocer
      SPRING_DATASOURCE_USERNAME: omnigrocer
      SPRING_DATASOURCE_PASSWORD: omnigrocer_secret_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  postgres_data:
